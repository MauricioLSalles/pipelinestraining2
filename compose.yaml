services:
  restapp:
    depends_on:
      - redisService
    image: mauriciolsalles/restapp:1.0.${SEM_VERSION}
    container_name: restapp
    restart: always
    ports:
      - ${RESTAPP_PORT}:5000
    networks:
     - network

  redisService:
    image: redis:alpine 
    ports:
      - ${REDIS_PORT}:6379
    networks:
     - network

networks:
  network: