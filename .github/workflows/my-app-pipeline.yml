name: CI

on:
  push:
    branches: [ "develop", "main","MauricioLeaño_p2_dev","MauricioLeaño_p2_base" ]
  pull_request:
    branches: [ "develop", "main" ,"MauricioLeaño_p2_dev","MauricioLeaño_p2_base" ]

  workflow_dispatch:

env: 
  SEM_VERSION: ""
  IMAGE_NAME:  ""

jobs:
  ## 🔧 1. 
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: test
        run: python -m pytest test/unit -v

  ## 🔧 2. 
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: build
        run: docker build -t restapp:1.0.0 .
